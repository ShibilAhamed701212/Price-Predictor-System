line-length = 100
target-version = "py310"
extend-exclude = ["mlruns", "analysis/EDA.ipynb"]

[lint]
# pycodestyle errors, pyflakes and import sorting
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
known-first-party = ["src", "steps", "pipelines"]

[lint.per-file-ignores]
# The interactive walkthrough imports each library right before the step that uses it.
"run_step_by_step.py" = ["E402"]
